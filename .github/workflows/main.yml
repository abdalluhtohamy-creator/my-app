name: Build Android APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Buildozer spec
        run: |
          pip install buildozer
          buildozer init
          sed -i 's/requirements = .*/requirements = python3,kivy==2.3.0,kivymd==1.2.0,arabic_reshaper,python-bidi/' buildozer.spec
          sed -i 's/# android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec

      - name: Build with Buildozer Action
        uses: ArtemSydoryk/buildozer-action@v1.2
        with:
          command: buildozer -v android debug
          subfolder: '.'

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: bin/*.apk
