name: Build Android APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install buildozer cython<3.0.0

      - name: Initialize Buildozer spec
        run: |
          buildozer init
          sed -i 's/requirements = .*/requirements = python3,kivy==2.3.0,kivymd==1.2.0,arabic_reshaper,python-bidi/' buildozer.spec

      - name: Build with Buildozer
        uses: ArtemSydoryk/buildozer-action@v1.2
        with:
          command: buildozer -v android debug
          subfolder: '.'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: bin/*.apk
